const cue=new VTTCue(0,86400,"");cue.snapToLines=true;cue.line=-2;cue.align="start";cue.position=1;cue.positionAlign="line-left";cue.size=62;tr.addCue(cue);
const vtt=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
v.addEventListener("webkitbeginfullscreen",()=>{tr.mode="showing"});v.addEventListener("webkitendfullscreen",()=>{tr.mode="hidden"});
v.onerror=()=>{$("evt").textContent="The video could not be loaded. Check your connection and reload the page."};
const KO0=["IP","AT","OOP","DT","ASP","DSP","Other"],tk0=r=>{let k=KO0.indexOf(kind(r));if(k<0)k=6;return k*2+(/Bad$/.test(r)?1:0)};
const ROWS=[...new Set(CL.map(c=>c.r))].sort((a,b)=>tk0(a)-tk0(b));
const sel=new Set();let ordPick=false,showText=true;let queue=[],qi=-1,playing=false;
const mm=t=>{t=Math.max(0,t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60);return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")};
const col=r=>COL[kind(r)]||"#888";
let adj={};try{adj=JSON.parse(localStorage.getItem("clipAdj")||"{}")}catch(e){}
const saveAdj=()=>{try{localStorage.setItem("clipAdj",JSON.stringify(adj))}catch(e){}};
let order="time";const KO=["IP","AT","OOP","DT","ASP","DSP","Other"];
const tkey=r=>{let k=KO.indexOf(kind(r));if(k<0)k=KO.length-1;return k*2+(isB(r)?1:0)};
let Q="";const hit=c=>!Q||Q.split(/\s+/).every(t=>(c.r+" "+c.n).toLowerCase().includes(t));
const list=()=>CL.map((c,i)=>({...c,i,s:Math.max(0,c.s+OFF+((adj[i]||{}).s||0)),e:c.e+OFF+((adj[i]||{}).e||0)})).filter(c=>(sel.has(c.r)||(Q&&!sel.size))&&hit(c)).sort((a,b)=>order==="tactical"?(tkey(a.r)-tkey(b.r))||(a.s-b.s):a.s-b.s);
function rebuild(){const cur=queue[qi]?queue[qi].i:null;queue=qi>=0?list():[];if(cur!=null)qi=queue.findIndex(c=>c.i===cur)}
function trim(i,k,d){const a=adj[i]=adj[i]||{s:0,e:0};a[k]=(a[k]||0)+d;if(!a.s&&!a.e)delete adj[i];saveAdj();rebuild();
 if(k==="s"&&!v.hidden){const c=list().find(c=>c.i===i);v.currentTime=Math.max(0,c.s-(+$("pre").value))}render()}
const trims=c=>{const a=adj[c.i]||{},f=n=>n?(n>0?"+":"")+n+"s":"0";return `<div class="trim"><span class="lbl">Start</span><button data-t="${c.i}|s|-5">−5s</button><button data-t="${c.i}|s|5">+5s</button><span class="lbl">End</span><button data-t="${c.i}|e|-5">−5s</button><button data-t="${c.i}|e|5">+5s</button>${(a.s||a.e)?`<button data-t="${c.i}|r|0">Reset</button><span class="lbl">(${f(a.s)} / ${f(a.e)})</span>`:""}</div>`};
function buildChips(){
 $("quick").innerHTML=`<span class="lbl">Show</span><button class="chip" data-q="all">All</button><button class="chip" data-q="good">All Good</button><button class="chip" data-q="bad">All Bad</button><button class="chip" data-q="none">None</button>`;
 $("cats").innerHTML=ROWS.map(r=>{const n=CL.filter(c=>c.r===r).length;return `<button class="chip" data-r="${r}" aria-pressed="${sel.has(r)}"><i style="background:${col(r)}"></i>${r}<small>${n}</small></button>`}).join("")}
function render(){buildChips();const L=list();$("count").textContent=L.length+" of "+CL.length;
 $("pane").innerHTML=L.length?L.map(c=>`<div class="clip ${queue[qi]&&queue[qi].i===c.i?"on":""}" style="border-left:4px solid ${gc(c.r)}"><button class="main" data-i="${c.i}"><div class="h"><span><span class="dot" style="background:${col(c.r)}"></span>${c.r}</span><span class="lbl">${mm(c.s)}–${mm(c.e)}</span></div>${c.n?`<div class="n">${c.n.replace(/</g,"&lt;")}</div>`:""}</button>${trims(c)}</div>`).join(""):`<div class="empty">${Q?"No clips match “"+Q.replace(/</g,"&lt;")+"”.":"Choose <b>Clips in Order</b> or <b>Tactical Order</b> above to start playing, or pick categories below, or search."}</div>`;
 const on=$("pane").querySelector(".on");if(on)on.scrollIntoView({block:"nearest"});
 $("qinfo").textContent=playing?`Clip ${qi+1} of ${queue.length}`:"";
 $("playAll").textContent=playing?"❚❚ Pause":"▶ Play";$("fOT").setAttribute("aria-pressed",ordPick&&order==="time");$("fOK").setAttribute("aria-pressed",ordPick&&order==="tactical");$("oT").setAttribute("aria-pressed",ordPick&&order==="time");$("oK").setAttribute("aria-pressed",ordPick&&order==="tactical")}
function playAt(k){if(k<0||k>=queue.length){return stopQ()}qi=k;const c=queue[k];
 v.currentTime=Math.max(0,c.s-(+$("pre").value));v.play();playing=true;
 updateNow(true);render()}
function stopQ(){playing=false;qi=-1;v.pause();$("now").hidden=true;render()}
function start(fromId){queue=list();if(!queue.length)return;let k=0;if(fromId!=null){k=queue.findIndex(c=>c.i===fromId);if(k<0)k=0}playAt(k)}
const gc=r=>isG(r)?"#34c26f":isB(r)?"#f0605a":"#93a19a";
let nowKey="";

const esc=s=>s.replace(/</g,"&lt;");
function updateNow(force){if(!showText||!playing||qi<0){$("now").hidden=true;nowKey="";cue.text="";return}
 const t=v.currentTime;let act=queue.filter(c=>t>=c.s-.05&&t<=c.e&&(order!=="tactical"||c.r===queue[qi].r));if(!act.length)act=[queue[qi]];
 const key=act.map(c=>c.i).join(",");if(key===nowKey&&!force)return;nowKey=key;
 cue.text=act.map(c=>"<b>"+vtt(c.r)+"</b>"+(c.n?" — "+vtt(c.n):"")).join("\n");
 $("now").hidden=false;$("now").innerHTML=act.map(c=>`<div style="--c:${gc(c.r)}"><b>${c.r}</b>${c.n?" — "+esc(c.n):""}</div>`).join("")}
function advance(){const t=v.currentTime,lead=+$("pre").value;let k=qi+1;
 const same=c=>order==="time"||c.r===queue[qi].r;
 while(k<queue.length&&queue[k].e<=t&&same(queue[k]))k++;               // fully covered by footage already played
 if(k>=queue.length)return stopQ();
 if(same(queue[k])&&t>=queue[k].s-lead&&t<queue[k].e){qi=k;updateNow(true);render()}   // overlaps / adjoins: keep playing, no replay
 else playAt(k)}
v.addEventListener("timeupdate",()=>{$("clock").textContent="VIDEO "+mm(v.currentTime);
 if(playing&&qi>=0){if(v.currentTime>=queue[qi].e)advance();else updateNow()}});
v.addEventListener("ended",()=>{if(playing)stopQ()});
v.addEventListener("pause",()=>{});
$("playAll").onclick=()=>{if(v.hidden)return;if(!list().length){v.paused?v.play():v.pause();return}if(playing){playing=false;v.pause();render()}else if(qi>=0&&queue.length){playing=true;v.play();render()}else start()};
$("stop").onclick=stopQ;
$("next").onclick=()=>{if(v.hidden)return;if(!queue.length||qi<0){queue=list();const k=queue.findIndex(c=>c.s-(+$("pre").value)>v.currentTime+.5);playAt(k<0?0:k)}else playAt(qi+1)};
$("prev").onclick=()=>{if(v.hidden)return;if(!queue.length||qi<0){queue=list();let k=-1;queue.forEach((c,j)=>{if(c.s-(+$("pre").value)<v.currentTime-1.5)k=j});playAt(Math.max(0,k))}else playAt(Math.max(0,qi-1))};
const vidEl=$("vid");
const inFs=()=>!!document.fullscreenElement||vidEl.classList.contains("pfs");
function exitFs(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});vidEl.classList.remove("pfs");syncFs();wake()}
function tfs(){}
const touch=matchMedia("(pointer:coarse)");
function syncFs(){document.body.classList.toggle("pfsOn",vidEl.classList.contains("pfs"));const t=inFs()&&touch.matches;vidEl.classList.toggle("touchfs",t);if(t)v.removeAttribute("controls");else v.setAttribute("controls","")}
function enterFs(){if(inFs())return;const r=vidEl.requestFullscreen||vidEl.webkitRequestFullscreen;
 if(r){try{const p=r.call(vidEl);if(p&&p.catch)p.catch(()=>{vidEl.classList.add("pfs");syncFs();wake()});return}catch(e){}}
 vidEl.classList.add("pfs");syncFs();wake()}
function fullMatch(){sel.clear();ordPick=false;queue=[];qi=-1;playing=false;stopRev();mode="";mark();$("now").hidden=true;cue.text="";nowKey="";render();v.play()}
function launch(k){enterFs();if(k==="full")fullMatch();else{ROWS.forEach(r=>sel.add(r));setOrder(k)}}
$("lFull").onclick=()=>launch("full");$("lTime").onclick=()=>launch("time");$("lTac").onclick=()=>launch("tactical");
document.addEventListener("keydown",e=>{if(e.key==="Escape"){vidEl.classList.remove("pfs");syncFs()}});
v.addEventListener("dblclick",e=>{e.preventDefault();tfs()});
const fb=$("fsbar"),tpb=$("tp");let ft;const wake=()=>{fb.classList.remove("hide");tpb.classList.remove("hide");clearTimeout(ft);ft=setTimeout(()=>{if(inFs()&&!v.paused){fb.classList.add("hide");tpb.classList.add("hide")}},3000)};
$("vid").addEventListener("mousemove",wake);$("vid").addEventListener("click",wake);document.addEventListener("fullscreenchange",()=>{syncFs();wake()});
fb.onclick=e=>{const b=e.target.closest("button");if(!b)return;wake();if(b.dataset.o)setOrder(b.dataset.o);else if(b.id==="fPrev")$("prev").click();else if(b.id==="fNext")$("next").click();else if(b.id==="fPlay")$("playAll").click();else if(b.id==="fExit")exitFs();else if(b.id==="fFull")fullMatch()};
// Transport: rewind, slow-mo back/forward, fast forward, frame step
let rev=null,mode="";const FPS=30;
function stopRev(){clearInterval(rev);rev=null}
function mark(){document.querySelectorAll("#tp [data-m]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode&&mode!=="toggle"))}
function setMode(m){stopRev();if(mode===m&&m!=="toggle"){mode="";v.playbackRate=+$("rate").value;mark();if(m==="rew"||m==="slowb")return;v.playbackRate=+$("rate").value;return}
 if(m==="toggle"){mode="";mark();v.playbackRate=+$("rate").value;if(qi>=0||playing)$("playAll").click();else v.paused?v.play():v.pause();return}
 mode=m;mark();
 if(m==="rew"||m==="slowb"){v.pause();const step=m==="rew"?.75:.0625;rev=setInterval(()=>{if(v.currentTime<=0){stopRev();mode="";mark();return}v.currentTime=Math.max(0,v.currentTime-step)},250)}
 else{v.playbackRate=m==="ff"?2:.25;v.play()}}
$("tp").onclick=e=>{const b=e.target.closest("button");if(!b)return;wake();
 if(b.dataset.c)$(b.dataset.c).click();
 else if(b.dataset.m)setMode(b.dataset.m);
 else if(b.dataset.s)v.currentTime+=+b.dataset.s;
 else if(b.dataset.f){v.pause();v.currentTime+=(+b.dataset.f)/FPS}};
v.addEventListener("play",()=>{$("tpPlay").textContent="❚❚ Pause"});v.addEventListener("pause",()=>{$("tpPlay").textContent="▶ Play"});
// Make the video's own full-screen button use our container, so text and controls stay visible
$("fsBtn").onclick=()=>enterFs();
$("oT").onclick=()=>setOrder("time");$("oK").onclick=()=>setOrder("tactical");
function setOrder(o){order=o;ordPick=true;if(!sel.size)ROWS.forEach(r=>sel.add(r));stopRev();mode="";mark();queue=[];qi=-1;playing=false;start()}
function setText(b){showText=b;["txt","fTxt"].forEach(id=>{$(id).setAttribute("aria-pressed",b);$(id).textContent="Text: "+(b?"On":"Off")});nowKey="";if(!b)$("now").hidden=true;else updateNow(true)}
$("txt").onclick=()=>setText(!showText);$("fTxt").onclick=()=>setText(!showText);
$("rate").onchange=e=>{mode="";mark();stopRev();v.playbackRate=+e.target.value};
$("cats").onclick=e=>{const b=e.target.closest("[data-r]");if(!b)return;sel.has(b.dataset.r)?sel.delete(b.dataset.r):sel.add(b.dataset.r);queue=[];qi=-1;playing=false;render()};
$("quick").onclick=e=>{const b=e.target.closest("[data-q]");if(!b)return;const q=b.dataset.q;sel.clear();ROWS.forEach(r=>{if(q==="all"||(q==="good"&&isG(r))||(q==="bad"&&isB(r)))sel.add(r)});queue=[];qi=-1;playing=false;render()};
$("q").oninput=e=>{Q=e.target.value.trim().toLowerCase();rebuild();render()};
$("pane").onclick=e=>{const t=e.target.closest("[data-t]");if(t){const [i,k,d]=t.dataset.t.split("|");if(k==="r"){delete adj[i];saveAdj();rebuild();render()}else trim(+i,k,+d);return}
 const b=e.target.closest("[data-i]");if(b&&!v.hidden)start(+b.dataset.i)};
document.addEventListener("keydown",e=>{if(/INPUT|SELECT/.test(e.target.tagName)||v.hidden)return;
 if(e.key==="f"||e.key==="F")tfs();else if(e.key==="]")$("next").click();else if(e.key==="[")$("prev").click();else if(e.key==="ArrowRight")v.currentTime+=5;else if(e.key==="ArrowLeft")v.currentTime-=5;else if(e.key===" "){e.preventDefault();v.paused?v.play():v.pause()}});
function show(){$("evt").textContent="Pick categories, then press Play — or click any clip."}

const sc=$("scrub");let drag=false;sc.oninput=()=>{drag=true;v.currentTime=+sc.value};sc.onchange=()=>{drag=false};
v.addEventListener("timeupdate",()=>{const d=v.duration||0;if(d){sc.max=d;$("tdur").textContent=mm(d)}if(!drag)sc.value=v.currentTime;$("tcur").textContent=mm(v.currentTime)});
function setOff(x){OFF=Math.round(x*10)/10;try{localStorage.setItem("ytOffset",OFF)}catch(e){}$("off").value=OFF;$("offinfo").textContent=OFF?`(clips shifted ${OFF>0?"+":""}${OFF}s)`:"(no shift)";queue=[];qi=-1;playing=false;$("now").hidden=true;render()}
$("off").onchange=e=>{const n=parseFloat(e.target.value);if(!isNaN(n))setOff(n)};$("om").onclick=()=>setOff(OFF-1);$("op").onclick=()=>setOff(OFF+1);
$("kick").onclick=()=>setOff(v.currentTime-CL[0].s);

ROWS.forEach(r=>sel.add(r));ordPick=true;order="time";setOff(OFF);show();$("evt").textContent="Use the buttons above to watch the full match or the clips.";
</script></body></html>
