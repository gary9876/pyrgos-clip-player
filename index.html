<div class="wrap">

<div class="grid">
 <div class="stage">

   <div class="fsbar" id="fsbar"><button id="fFull">Full match</button><button data-o="time" id="fOT">Game Order</button><button data-o="tactical" id="fOK">Tactical Order</button><button id="fTeam">Team Actions</button><button id="fTxt" aria-pressed="true">Text: On</button><button id="fExit">✕ Exit</button></div>
  </div>
  <div class="pad row" hidden>
   <button class="primary" id="playAll">▶ Play</button>
   <button id="stop">■ Stop</button><button id="prev">◀ Prev clip</button><button id="next">Next clip ▶</button>
   <span class="lbl" id="qinfo"></span>
   <span style="flex:1"></span>
   <span class="lbl">Lead-in</span><select id="pre"><option value="0" selected>0s</option><option value="3">3s</option><option value="5">5s</option><option value="10">10s</option></select>
   <select id="rate"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
  </div>
  <div class="cats off" hidden><div class="row"><span class="lbl"><b>Sync to this video</b> — the clip times came from a different recording, so line them up once:</span></div>
   <div class="row"><button id="kick">Set: this moment = first clip (kickoff)</button><span class="lbl">Offset</span><button id="om">−1s</button><input type="text" id="off" aria-label="Offset seconds"><button id="op">+1s</button><span class="lbl" id="offinfo"></span></div></div>
 </div>
 <div class="aside"><h3><span class="seg"><button id="oT" aria-pressed="false">Clips in Order</button><button id="oK" aria-pressed="false">Tactical Order</button></span><span class="lbl" id="count"></span></h3><div class="srch"><input type="search" id="q" placeholder="Search clip names and notes…" aria-label="Search clips" autocomplete="off"></div><div class="tfilt" id="tfilt" hidden></div><div class="pane" id="pane"></div></div>
</div>
  <div class="cats" style="margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)"><div class="row" id="quick"></div><div class="row" id="cats"></div></div>
</div>
<dialog id="exDlg"><form method="dialog" id="exForm">
<h3>Export video</h3>
<div id="exSetup"><label><input type="radio" name="exWhat" value="one" id="exOne"> <span id="exOneL">Current clip</span></label>
<label><input type="radio" name="exWhat" value="all" checked> <span id="exAllL">All clips in the current list</span></label>
<label class="exTxt"><input type="checkbox" id="exText" checked> Include clip text on the video</label>
<p class="lbl">Works best in Chrome or Edge on a computer. Keep this tab open while it runs.</p>
<div class="row"><button type="button" class="primary" id="exGo">Start export</button><button value="cancel">Cancel</button></div></div>
<div id="exRun" hidden><p id="exMsg">Preparing…</p><progress id="exProg" max="1" value="0"></progress><p class="lbl" id="exEta"></p>
<div class="row"><button type="button" class="primary" id="exShare" hidden>Save to Photos / Share</button><button type="button" id="exStop">Cancel export</button><button value="close" id="exClose" hidden>Close</button></div></div>
</form></dialog>
